<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVstra</title>
    <style>
      :root {
        --bg: #08111f;
        --panel: #0f1d33;
        --panel-2: #122847;
        --text: #edf6ff;
        --muted: #a7c3df;
        --accent: #72e2a3;
        --accent-2: #5ab0ff;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: radial-gradient(circle at top, #10233d 0%, var(--bg) 50%, #071019 100%);
        color: var(--text);
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      .card {
        width: min(900px, 90vw);
        background: rgba(15, 29, 51, 0.9);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 22px;
        box-shadow: 0 30px 80px rgba(0,0,0,0.35);
        overflow: hidden;
      }

      .hero {
        display: grid;
        grid-template-columns: 1.2fr 0.8fr;
        gap: 24px;
        padding: 42px;
      }

      @media (max-width: 700px) {
        .hero {
          grid-template-columns: 1fr;
          padding: 28px 22px;
        }
      }

      .eyebrow {
        display: inline-block;
        padding: 8px 12px;
        border-radius: 999px;
        background: rgba(114, 226, 163, 0.14);
        border: 1px solid rgba(114, 226, 163, 0.35);
        color: var(--accent);
        font-size: 12px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
      }

      h1 {
        margin: 18px 0 12px;
        font-size: clamp(2.2rem, 5vw, 4.5rem);
        line-height: 1.05;
      }

      p {
        color: var(--muted);
        font-size: 1.08rem;
        line-height: 1.7;
        margin: 0;
      }

      .actions {
        margin-top: 28px;
        display: flex;
        gap: 16px;
        flex-wrap: wrap;
      }

      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 14px 22px;
        border-radius: 12px;
        text-decoration: none;
        font-weight: 700;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }

      .btn:hover {
        transform: translateY(-1px);
      }

      .btn.primary {
        background: linear-gradient(135deg, var(--accent-2), var(--accent));
        color: #061217;
        box-shadow: 0 22px 30px rgba(90, 176, 255, 0.35);
      }

      .btn.secondary {
        background: rgba(255,255,255,0.04);
        border: 1px solid rgba(255,255,255,0.12);
        color: var(--text);
      }

      .panel {
        background: linear-gradient(180deg, var(--panel-2), rgba(18, 40, 71, 0.9));
        border-radius: 18px;
        border: 1px solid rgba(255,255,255,0.08);
        padding: 22px;
        display: grid;
        place-items: center;
      }

      .orbit {
        width: 240px;
        height: 240px;
        position: relative;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(114,226,163,0.18), rgba(90,176,255,0.08) 40%, transparent 70%);
        border: 1px solid rgba(114,226,163,0.35);
      }

      .ring {
        position: absolute;
        inset: 18px;
        border-radius: 50%;
        border: 1px solid rgba(255,255,255,0.18);
        transform: rotate(24deg);
      }

      .ring:nth-child(2) {
        inset: 40px;
        transform: rotate(-18deg);
      }

      .dot {
        position: absolute;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        box-shadow: 0 0 18px rgba(114, 226, 163, 0.8);
      }

      .dot::before {
        content: "";
        position: absolute;
        width: 26px;
        height: 26px;
        border-radius: 50%;
        border: 1px solid rgba(114,226,163,0.5);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="hero">
        <div>
          <span class="eyebrow">EVstra</span>
          <h1>Built for motion, energy, and flow.</h1>
          <p>
            This is a temporary landing page to make the repo viewable right away.
            Replace this with your real design once you’re ready to publish the full site.
          </p>
          <div class="actions">
            <a class="btn primary" href="https://github.com/Cyprus808/EVstra" target="_blank" rel="noreferrer">Open Repo</a>
            <a class="btn secondary" href="https://github.com/Cyprus808/EVstra/blob/main/README.md" target="_blank" rel="noreferrer">Read README</a>
          </div>
        </div>

        <div class="panel" aria-label="Preview illustration">
          <div class="orbit">
            <div class="ring"></div>
            <div class="ring"></div>
            <div class="dot"></div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
